# TPM2 auto-unlock of the LUKS root through clevis. The hook scripts live in
# /etc/initcpio/{hooks,install}/clevis (vendored from the AUR's
# mkinitcpio-clevis-hook). Runs after Omarchy's drop-ins, so it survives their
# updates: it puts clevis right before encrypt in whatever HOOKS they set.
if [[ " ${HOOKS[*]} " != *" clevis "* ]]; then
  _clevis_hooks=()
  for _clevis_hook in "${HOOKS[@]}"; do
    [[ $_clevis_hook == encrypt ]] && _clevis_hooks+=(clevis)
    _clevis_hooks+=("$_clevis_hook")
  done
  HOOKS=("${_clevis_hooks[@]}")
  unset _clevis_hooks _clevis_hook
fi
